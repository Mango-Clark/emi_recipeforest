tasks.register('verifyEmiCompatibilityMatrix') {
    group = 'verification'
    description = 'Resolves EMI 1.1.13-1.1.24 and verifies RecipeForest JVM contracts.'

    doLast {
        def executableName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'javap.exe' : 'javap'
        def javap = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(java_version)
        }.get().metadata.installationPath.file("bin/${executableName}").asFile

        (13..24).each { patch ->
            def version = "1.1.${patch}+1.21.1"
            def artifact = configurations.detachedConfiguration(
                    dependencies.create("dev.emi:emi-xplat-mojmap:${version}"))
            artifact.transitive = false
            def jar = artifact.singleFile
            def contracts = emiCompatibilityContracts.collectEntries { owner, members ->
                [(owner): members.collect { new LinkedHashMap(it) }]
            }
            contracts['dev.emi.emi.runtime.EmiFavorite$Synthetic'] << [
                    token: 'EmiFavorite$Synthetic(',
                    descriptor: patch >= 21
                            ? '(Ldev/emi/emi/api/recipe/EmiRecipe;JJJI)V'
                            : '(Ldev/emi/emi/api/recipe/EmiRecipe;JJI)V',
                    access: 'public'
            ]
            if (patch >= 22) {
                contracts['dev.emi.emi.bom.MaterialNode'] = [[
                        token: ' catalyst;', descriptor: 'Z', access: 'public'
                ]]
            } else {
                contracts['dev.emi.emi.bom.TreeCost'] = [[
                        token: ' isCatalyst(',
                        descriptor: '(Ldev/emi/emi/api/stack/EmiIngredient;)Z',
                        access: 'public static'
                ]]
            }

            contracts.each { owner, members ->
                def output = new ByteArrayOutputStream()
                def result = project.exec {
                    commandLine javap.absolutePath, '-classpath', jar.absolutePath, '-p', '-s', owner
                    standardOutput = output
                    errorOutput = output
                    ignoreExitValue = true
                }
                if (result.exitValue != 0) {
                    throw new GradleException("EMI ${version}: missing class ${owner}: ${output.toString('UTF-8')}")
                }
                def lines = output.toString('UTF-8').readLines()
                members.each { member ->
                    def found = (0..<lines.size()).any { index ->
                        def signature = lines[index].trim()
                        if (!signature.startsWith(member.access) || !signature.contains(member.token)) {
                            return false
                        }
                        def descriptorLine = ((index + 1)..<lines.size()).find { !lines[it].trim().isEmpty() }
                        return descriptorLine != null
                                && lines[descriptorLine].trim() == "descriptor: ${member.descriptor}"
                    }
                    if (!found) {
                        throw new GradleException("EMI ${version}: missing or incompatible ${owner}"
                                + " ${member.token.trim()} descriptor ${member.descriptor}")
                    }
                }
            }
            def emiApiBytecode = new ByteArrayOutputStream()
            def emiApiResult = project.exec {
                commandLine javap.absolutePath, '-classpath', jar.absolutePath, '-p', '-c', '-s',
                        'dev.emi.emi.api.EmiApi'
                standardOutput = emiApiBytecode
                errorOutput = emiApiBytecode
                ignoreExitValue = true
            }
            if (emiApiResult.exitValue != 0) {
                throw new GradleException("EMI ${version}: unable to inspect EmiApi bytecode: "
                        + emiApiBytecode.toString('UTF-8'))
            }
            def apiLines = emiApiBytecode.toString('UTF-8').readLines()
            def viewTreeStart = apiLines.findIndexOf { it.trim() == 'public static void viewRecipeTree();' }
            def viewTreeEnd = viewTreeStart < 0 ? -1 : ((viewTreeStart + 1)..<apiLines.size()).find {
                def line = apiLines[it]
                line.startsWith('  ') && !line.startsWith('    ') && line.trim().endsWith(';')
            }
            if (viewTreeEnd == null || viewTreeEnd < 0) {
                viewTreeEnd = apiLines.size()
            }
            def newBoMScreenCount = viewTreeStart < 0 ? 0 : apiLines.subList(viewTreeStart, viewTreeEnd).count {
                it.contains('new') && it.contains('// class dev/emi/emi/screen/BoMScreen')
            }
            if (newBoMScreenCount != 2) {
                throw new GradleException("EMI ${version}: EmiApi.viewRecipeTree()V expected exactly two NEW "
                        + "dev/emi/emi/screen/BoMScreen sites, found ${newBoMScreenCount}")
            }
            logger.lifecycle("Verified EMI ${version}")
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
